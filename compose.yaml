services:
  postgres:
    image: postgres:16-alpine
    container_name: thien-minh-dental-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: thien_minh_dental
      POSTGRES_USER: thien_minh
      POSTGRES_PASSWORD: thien_minh_dev
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U thien_minh -d thien_minh_dental"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
